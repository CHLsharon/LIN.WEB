<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入｜共讀 AI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="back-link" href="index.html">← 回首頁</a>
      <p class="eyebrow">Welcome Back</p>
      <h1>登入帳號</h1>
      <p class="auth-desc">登入後即可使用閱讀紀錄、筆記與 AI 學習助手。</p>
      <form id="loginForm">
        <label for="email">電子信箱</label>
        <input type="email" id="email" name="email" placeholder="請輸入電子信箱" required />
        <label for="password">密碼</label>
        <input type="password" id="password" name="password" placeholder="請輸入密碼" required />
        <div class="auth-row">
          <a href="forgot-password.html">忘記密碼？</a>
        </div>
        <button class="auth-btn" type="submit">登入</button>
      </form>
      <p class="auth-switch"> 還沒有帳號？ <a href="register.html">立即註冊</a></p>
    </section>
  </main>
<script>
  const loginForm = document.getElementById('loginForm');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault(); 
    console.log("前端：嘗試發送登入請求...");

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      // 這裡使用 /api/login 是 Vercel 的標準寫法
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      });

      // 檢查回應狀態
      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || "伺服器回應錯誤");
      }

      const data = await response.json();

      if (data.success) {
        localStorage.setItem('userId', data.userId);
        localStorage.setItem('username', data.username);

        alert(`歡迎回來，${data.username}！`);
        // 建議跳轉到你的後台主頁，例如 dashboard.html 或 index.html
        window.location.href = "index.html"; 
      } else {
        alert(data.message || "登入失敗，請檢查帳密");
      }
    } catch (error) {
      console.error("登入出錯細節:", error);
      alert("錯誤: " + error.message);
    }
  });
</script>
</body>
</html>
