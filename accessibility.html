      <p class="eyebrow">Reading Support</p>
      <h1>閱讀輔助</h1>

          <p>使用者可以放大或縮小文字，減少閱讀疲勞。</p>

        <div class="feature-card">
          <h3>行距調整</h3>
          <p>增加段落與行距，讓文章更容易辨識。</p>
        </div>

        <div class="feature-card">
          <h3>高對比模式</h3>
          <p>提供更清楚的文字與背景對比，協助視覺辨識。</p>
        </div>

        <div class="feature-card">
          <h3>深色模式</h3>
          <p>降低長時間閱讀時的眼睛負擔。</p>
        </div>

        <div class="feature-card">
          <h3>AI 摘要</h3>
          <p>將文章整理成簡短重點，幫助快速理解內容。</p>
        </div>

      </div>
