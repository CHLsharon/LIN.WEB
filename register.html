<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>註冊｜共讀 AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="back-link" href="index.html">← 回首頁</a>
      <p class="eyebrow">Create Account</p>
      <h1>建立帳號</h1>
      <p class="auth-desc">註冊後可以儲存閱讀紀錄、收藏文章與個人筆記。</p>

      <form id="registerForm">
        <label>
          使用者名稱
          <input type="text" id="username" name="username" placeholder="請輸入名稱" required />
        </label>

        <label>
          電子信箱
          <input type="email" id="email" name="email" placeholder="請輸入電子信箱" required />
        </label>

        <label>
          密碼
          <input type="password" id="password" name="password" placeholder="請輸入密碼" required />
        </label>
        
        </form>
        <label>
          確認密碼
          <input type="password" placeholder="再次輸入密碼" required />
        </label>
        <button class="auth-btn" type="submit">註冊</button>
      </form>

      <p class="auth-switch">
        已經有帳號？<a href="login.html">前往登入</a>
      </p>
    </section>
  </main>

  <script>
    const regForm = document.getElementById('registerForm');
    
    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      console.log("前端：已點擊註冊按鈕");

      const username = e.target.querySelector('input[type="text"]').value;
      const email = e.target.querySelector('input[type="email"]').value;
      const password = e.target.querySelectorAll('input[type="password"]')[0].value;

      try {
        const res = await fetch("https://lin-web-red.vercel.app/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password })
        });
        
        const data = await res.json();
        console.log("後端回傳：", data);
        
        if (data.success) {
          alert("註冊成功");
          window.location.href = "login.html";
        } else {
          alert("註冊失敗：" + data.message);
        }
      } catch (err) {
        console.error("發送請求失敗，原因：", err);
        alert("無法連線至伺服器，請檢查後端是否開啟或網址是否正確");
      }
    });
  </script>
</body>
</html>
