<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘記密碼｜共讀 AI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="back-link" href="login.html">← 回登入</a>

      <p class="eyebrow">Password Recovery</p>
      <h1>忘記密碼</h1>
      <p class="auth-desc">
        請輸入註冊時使用的電子信箱，我們將寄送密碼重設連結。
      </p>

      <form>
        <label>
          電子信箱
          <input type="email" placeholder="請輸入電子信箱" required />
        </label>

        <button class="auth-btn" type="submit">寄送重設連結</button>
      </form>

      <p class="auth-switch">
        想起密碼了？<a href="login.html">回到登入</a>
      </p>
    </section>
  </main>
</body>
</html>
